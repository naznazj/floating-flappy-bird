[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floating-flappy-bird"
version = "0.1.0"
description = "A borderless, transparent, always-on-top Flappy Bird overlay for Windows with an adaptive Auto-Pilot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/naznazj/floating-flappy-bird"
Repository = "https://github.com/naznazj/floating-flappy-bird"

[project.scripts]
flappy-float = "flappy_float:main"

[project.gui-scripts]
floating-flappy-bird = "flappy_float:main"

[tool.setuptools]
py-modules = ["flappy_float"]
